# Workflow name
name: PHP Unit Tests

# Triggers
on:
  push:
    branches:
      - 'main'
      - 'v3.7-dev'
      - 'v5-dev'
  pull_request:
    branches:
      - 'main'
      - 'v3.7-dev'
      - 'v5-dev'

# Jobs/Pipelines
jobs:
  php-unit:
    name: 'PHP Unit (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.3, 8.4, 8.5, 8.6 ]
        laravel: [ 13 ]
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: "Setup PHP with tools"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          tools: composer, phpunit

      - name: "Get composer cache directory"
        id: composer-cache
        run: 'echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT'

      - name: "Cache dependencies"
        uses: actions/cache@v4
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-php-${{ matrix.php}}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.json') }}"
          restore-keys: "${{ runner.os }}-php-${{ matrix.php}}-laravel-${{ matrix.laravel }}-composer-"

      # Pin the Laravel major so the conformance cases run against each supported version
      - name: "Install Composer dependencies"
        run: |
          composer require --no-update --no-interaction \
            "illuminate/console:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/validation:^${{ matrix.laravel }}.0"
          composer update --no-ansi --no-interaction --no-progress --no-scripts --prefer-dist --with-all-dependencies

      - name: 'Run PHPUnit'
        run: ./vendor/bin/phpunit

  # Both branches must run the same conformance cases.
  conformance-version:
    name: 'Conformance package version'
    runs-on: ubuntu-latest
    env:
      PACKAGE: 'upmind/provision-validation-conformance'
      OTHER_BRANCH: 'v3.7-dev'
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Compare the required version with the other branch'
        run: |
          git fetch --no-tags --depth 1 origin "$OTHER_BRANCH"
          ours=$(jq -r --arg p "$PACKAGE" '."require-dev"[$p] // empty' composer.json)
          theirs=$(git show FETCH_HEAD:composer.json | jq -r --arg p "$PACKAGE" '."require-dev"[$p] // empty')

          if [ -z "$ours" ]; then
            echo "::error::composer.json does not require $PACKAGE"
            exit 1
          fi

          if [ -z "$theirs" ]; then
            echo "::warning::$OTHER_BRANCH does not require $PACKAGE yet"
            exit 0
          fi

          if [ "$ours" != "$theirs" ]; then
            echo "::error::This branch requires $PACKAGE $ours, but $OTHER_BRANCH requires $theirs"
            exit 1
          fi
